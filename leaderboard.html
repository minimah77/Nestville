<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hall of Fame · Nestville</title>
<meta name="theme-color" content="#7fb6d6">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#10303c;--mute:#46666f;--fd:"Fraunces",Georgia,serif;--fb:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--ink);font:500 15px/1.35 var(--fb)}
body{background:linear-gradient(180deg,#6fb0d9 0,#a9d3e4 32%,#d7e9e6 62%,#efe6cc 100%) fixed;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 30px)}
.hills{position:fixed;left:0;right:0;bottom:0;height:34vh;z-index:-1;background:radial-gradient(120% 90% at 20% 110%,#5f9f58 40%,transparent 41%),radial-gradient(110% 80% at 85% 115%,#4f8a4f 40%,transparent 41%),radial-gradient(150% 60% at 50% 120%,#3d7a6a 45%,transparent 46%);opacity:.5}
.wrap{max-width:560px;margin:0 auto}
.gl{background:linear-gradient(145deg,rgba(255,255,255,.52),rgba(255,255,255,.22));backdrop-filter:blur(22px) saturate(1.8);-webkit-backdrop-filter:blur(22px) saturate(1.8);border:1px solid rgba(255,255,255,.65);box-shadow:0 12px 38px rgba(14,52,66,.22),inset 0 1px 0 rgba(255,255,255,.8)}
header{display:flex;align-items:center;gap:12px;border-radius:22px;padding:12px 14px;margin-bottom:12px}
header h1{margin:0;font:600 22px/1.1 var(--fd)}header p{margin:2px 0 0;color:var(--mute);font-size:13px;font-weight:600}
.back{width:44px;height:44px;border-radius:16px;background:rgba(255,255,255,.6);display:grid;place-items:center;color:var(--ink);text-decoration:none;flex:none}
.back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:6px;border-radius:20px;padding:5px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:transparent;border-radius:15px;height:40px;font:700 13.5px var(--fb);color:var(--mute);cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(16,56,70,.15)}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:10px;border-radius:26px;padding:22px 12px 0;margin-bottom:12px;overflow:hidden}
.pc{flex:1;max-width:150px;text-align:center;text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:center}
.pc .cr{font-size:22px;height:26px}
.pc .av{border-radius:50%;border:3px solid #fff;box-shadow:0 6px 16px rgba(14,52,66,.25);background:#fff;line-height:0}
.pc b{display:block;margin-top:6px;font-size:12.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc small{color:var(--mute);font-weight:700;font-size:12px}
.pc .st{margin-top:8px;width:100%;border-radius:16px 16px 0 0;display:grid;place-items:start center;padding-top:8px;font:600 26px var(--fd);color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.2)}
.p1 .st{height:104px;background:linear-gradient(180deg,#f2c25a,#d99a22)}.p2 .st{height:78px;background:linear-gradient(180deg,#b8c4cc,#8e9ba4)}.p3 .st{height:60px;background:linear-gradient(180deg,#d9a073,#b27644)}
.list{border-radius:24px;padding:4px 14px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid rgba(16,48,60,.1);text-decoration:none;color:inherit}
.row:first-child{border-top:0}.row .n{width:22px;text-align:center;font-weight:700;color:var(--mute)}
.row .av{line-height:0;flex:none}.row .nm{flex:1;min-width:0}.row .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .nm small{color:var(--mute);font-weight:600}
.row .v{font-weight:700}.row.me{background:linear-gradient(90deg,rgba(233,169,58,.22),transparent);margin:0 -14px;padding-left:14px;padding-right:14px}
.hint{text-align:center;color:var(--mute);font-size:13px;margin:14px 0 0;font-weight:600}
:focus-visible{outline:2px solid #0d6e86;outline-offset:2px}
</style></head><body><div class="hills"></div>
<div class="wrap">
<header class="gl"><a class="back" href="./" aria-label="Back to the village"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a><div><h1>Hall of Fame</h1><p id="sub">The legends of Nestville</p></div></header>
<div class="tabs gl" id="tabs"><button data-k="coins" class="on">Richest</button><button data-k="land">Land</button><button data-k="streak">Streak</button></div>
<div class="pod gl" id="pod"></div>
<div class="list gl" id="list"></div>
<p class="hint">Preview standings. Tap a name to fly to their house.</p>
</div>
<script type="module">
import { load, stats, avatar } from './shared.js';
const S = load(), $ = id => document.getElementById(id);
const rows = S.houses.map(h => ({ u: h.u, ...stats(h.u) }));
$('sub').textContent = rows.length + ' residents';
const fmt = { coins: v => v.toLocaleString('en-US'), land: v => v + ' plots', streak: v => v + ' days' };
const label = { coins: 'coins', land: 'land', streak: 'streak' };
let k = 'coins';
function draw() {
  const r = rows.slice().sort((a, b) => b[k] - a[k]);
  const top = [r[1], r[0], r[2]].filter(Boolean), cls = { 0: 'p2', 1: 'p1', 2: 'p3' }, rk = { 0: 2, 1: 1, 2: 3 };
  $('pod').innerHTML = top.map((x, i) => `<a class="pc ${cls[i]}" href="./#@${x.u}"><span class="cr">${i === 1 ? '👑' : ''}</span><span class="av">${avatar(x.u, i === 1 ? 68 : 54)}</span><b>@${x.u}</b><small>${fmt[k](x[k])}</small><span class="st">${rk[i]}</span></a>`).join('');
  $('list').innerHTML = r.slice(3, 30).map((x, i) => `<a class="row${x.u === S.me ? ' me' : ''}" href="./#@${x.u}"><span class="n">${i + 4}</span><span class="av">${avatar(x.u, 40)}</span><span class="nm"><b>@${x.u}</b><small>${x.land} plots · ${x.streak} day streak</small></span><span class="v">${k === 'coins' ? fmt.coins(x.coins) : fmt[k](x[k])}</span></a>`).join('');
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; k = b.dataset.k; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b)); draw(); });
draw();
</script></body></html>
