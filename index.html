<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nestville</title>
<meta name="description" content="A lakeside alpine village where every follower gets a house. Fly around, find your home, claim your spot.">
<meta name="theme-color" content="#7fb6d6">
<link rel="canonical" href="https://nestville.vercel.app/">
<meta property="og:url" content="https://nestville.vercel.app/"><meta property="og:title" content="Nestville"><meta property="og:description" content="A lakeside alpine village where every follower gets a house.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@500;600;700&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{--ink:#10303c;--mute:#46666f;--acc:#e9a93a;--fd:"Fraunces",Georgia,serif;--fb:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
--glass:linear-gradient(145deg,rgba(255,255,255,.46),rgba(255,255,255,.2));--glass2:linear-gradient(160deg,rgba(255,255,255,.78),rgba(244,251,252,.6));--bd:rgba(255,255,255,.62)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#8dbad6;color:var(--ink);font:500 15px/1.35 var(--fb);overscroll-behavior:none;-webkit-text-size-adjust:100%}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;cursor:grab}
#stage canvas:active{cursor:grabbing}
.gl{background:var(--glass);backdrop-filter:blur(22px) saturate(1.8);-webkit-backdrop-filter:blur(22px) saturate(1.8);border:1px solid var(--bd);box-shadow:0 12px 38px rgba(14,52,66,.24),inset 0 1px 0 rgba(255,255,255,.8),inset 0 -1px 0 rgba(255,255,255,.18)}
.gl2{background:var(--glass2)}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font:700 11.5px var(--fb);padding:4px 10px;border-radius:99px;color:var(--ink);background:rgba(255,255,255,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.75);box-shadow:0 4px 14px rgba(14,52,66,.2);will-change:transform;transition:opacity .25s}
.lb.k{background:rgba(233,169,58,.92);color:#2b1d05;border-color:rgba(255,236,190,.9)}
.lb.s{background:#fff;font-size:12.5px}
#top{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
#top>*{pointer-events:auto}
#brand{border-radius:20px;padding:10px 16px 10px 14px;display:flex;flex-direction:column}
#brand b{font:600 22px/1 var(--fd);letter-spacing:.2px}
#live{font-size:12px;color:var(--mute);margin-top:5px;display:flex;align-items:center;gap:6px;font-weight:700}
#live i{width:8px;height:8px;border-radius:50%;background:#e2553f;box-shadow:0 0 0 0 rgba(226,85,63,.6);animation:p 2s infinite}
@keyframes p{70%{box-shadow:0 0 0 7px rgba(226,85,63,0)}}
#tools{display:flex;gap:1px;border-radius:18px;padding:3px}
.ib{border:0;background:transparent;color:var(--ink);height:34px;min-width:34px;padding:0 6px;border-radius:13px;font:700 13px var(--fb);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none;transition:background .2s}
.ib:hover,.ib.on{background:rgba(255,255,255,.62)}
.ib svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid #0d6e86;outline-offset:2px}
#bar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:540px;margin:auto;display:flex;gap:8px;padding:7px;border-radius:24px}
#bar input{flex:1;min-width:0;border:0;background:rgba(255,255,255,.55);border-radius:17px;padding:0 15px;height:46px;font:600 16px var(--fb);color:var(--ink);outline-offset:0}
#bar input::placeholder{color:#58767f}
.pb{border:0;border-radius:17px;background:var(--ink);color:#f6fbfb;font:700 14px var(--fb);padding:0 20px;height:46px;cursor:pointer;transition:transform .15s}
.pb:active{transform:scale(.97)}
.pb.g{background:rgba(255,255,255,.6);color:var(--ink)}
.pb.gold{background:linear-gradient(135deg,#f2c25a,#e09a22);color:#2b1d05}
#card{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);max-width:540px;margin:auto;border-radius:24px;padding:16px 18px;display:none}
#card h3{margin:0 0 2px;font:600 20px var(--fd);padding-right:34px}#card p{margin:2px 0 12px;color:var(--mute);font-size:14.5px}
#card .x{position:absolute;right:10px;top:10px;width:34px;height:34px;border:0;background:rgba(255,255,255,.5);border-radius:50%;font-size:20px;line-height:1;color:var(--mute);cursor:pointer}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:580px;margin:auto;max-height:74vh;border-radius:28px 28px 0 0;padding:8px 18px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;z-index:5}
#sheet.open{transform:none}
#sheet .grab{width:42px;height:5px;border-radius:3px;background:rgba(16,48,60,.25);margin:2px auto 10px}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.45);padding:4px;border-radius:17px;margin-bottom:10px}
.tabs button{flex:1;border:0;background:transparent;border-radius:13px;height:38px;font:700 12px var(--fb);color:var(--mute);cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(16,56,70,.15)}
#pane{overflow:auto;-webkit-overflow-scrolling:touch}
#pane h4{margin:4px 0 6px;font:600 19px var(--fd)}
#pane input{width:100%;height:46px;border-radius:15px;border:1px solid rgba(16,48,60,.15);background:rgba(255,255,255,.75);padding:0 14px;font:600 16px var(--fb);color:var(--ink);margin:4px 0}
.note{font-size:13px;color:var(--mute);margin:6px 0 12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid rgba(16,48,60,.1)}
.row small{display:block;color:var(--mute);font-weight:600}.own{color:#b9770e;font-weight:700}
.row .pb{height:38px;padding:0 16px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 78px);transform:translate(-50%,-20px);opacity:0;pointer-events:none;max-width:min(92vw,470px);padding:12px 18px;border-radius:18px;font-weight:600;transition:.3s;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
#load{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(180deg,#6fb0d9,#cfe6ee 60%,#f3ecd6);transition:opacity .8s;font:600 28px var(--fd)}
#load small{font:600 14px var(--fb);color:var(--mute)}
#load.off{opacity:0;pointer-events:none}
.dots i{display:inline-block;width:8px;height:8px;margin:0 3px;border-radius:50%;background:var(--ink);animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-6px);opacity:.4}}
#tools .ib span{display:none}
#views{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 60px);display:flex;flex-direction:column;gap:2px;border-radius:16px;padding:3px}
#walkpad{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:none;flex-direction:column;gap:6px;border-radius:22px;padding:6px;touch-action:none;user-select:none;-webkit-user-select:none}
#walkpad.on{display:flex}
#walkpad .ib{width:54px;height:54px;border-radius:17px;background:rgba(255,255,255,.55)}
#walkpad .ib:active{background:#fff}
#walkpad .ib svg{width:26px;height:26px;stroke-width:2.4}
@media(prefers-reduced-motion:reduce){#live i,.dots i{animation:none}#sheet{transition:none}}
</style></head><body>
<div id="stage" aria-label="Nestville 3D village"></div>
<div id="labels"></div>
<div id="top">
 <div id="brand" class="gl"><b>Nestville</b><div id="live"><i></i><span id="stat"></span></div></div>
 <div id="tools" class="gl">
  <button class="ib" id="bTour" aria-label="Fly through the village"><svg viewBox="0 0 24 24"><path d="M5 4l14 8-14 8z"/></svg></button>
  <button class="ib" id="bGfx" aria-label="Graphics quality"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 15l3-4 3 3 2-2 3 3"/></svg><span id="gfx"></span></button>
  <a class="ib" href="leaderboard.html" aria-label="Leaderboard"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg></a>
  <button class="ib" id="bMenu" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
 </div>
</div>
<div id="views" class="gl">
 <button class="ib on" id="vHome" data-v="orbit" aria-label="Village overview" title="Village overview"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 20v-8l5-4 5 4v8M15 20v-5l3-2.5 3 2.5v5"/></svg></button>
 <button class="ib" id="vWalk" data-v="walk" aria-label="Canal walk (tap again for the next canal)" title="Canal walk"><svg viewBox="0 0 24 24"><path d="M3 9c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 15c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg></button>
 <button class="ib" id="vCot" aria-label="Cottages on the north shore" title="Cottages"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 20v-7l5-4 5 4v7M8 20v-3h4v3"/><circle cx="18" cy="14" r="1.8"/><path d="M18 16v4"/></svg></button>
 <button class="ib" id="vSeason" aria-label="Season. Tap to change" title="Season"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
 <button class="ib" id="vPh" data-v="ph" aria-label="Penthouse view (tap again for the next penthouse)" title="Penthouse view"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="1.5"/><path d="M10.5 7h3M10.5 11h3M10.5 15h3"/></svg></button>
</div>
<div id="walkpad" class="gl" aria-label="Walk controls"><button class="ib" id="wFwd" aria-label="Walk forward"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button><button class="ib" id="wBack" aria-label="Walk back"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div>
<div id="card" class="gl gl2"></div>
<div id="bar" class="gl"><input id="q" placeholder="Find your resident: @yourname" autocapitalize="none" autocomplete="off" enterkeyhint="search" aria-label="Find a resident"><button class="pb" id="bFind">Find</button></div>
<div id="sheet" class="gl gl2" role="dialog" aria-label="Menu"><div class="grab"></div>
 <div class="tabs"><button data-t="claim" class="on">My house</button><button data-t="ph">Penthouses</button><button data-t="shops">Shops</button><button data-t="cot">Cottages</button></div><div id="pane"></div></div>
<div id="toast" class="gl gl2" role="status"></div>
<div id="load"><div>Nestville</div><div class="dots"><i></i><i></i><i></i></div><small id="loadmsg">Building your village</small></div>
<script type="module" src="roads.js"></script>
<script type="module" src="town.js"></script>
<script type="module" src="realwater.js"></script>
<script type="module" src="streets.js"></script>
<script type="module" src="economy.js"></script>
<script type="module" src="seasons.js"></script>
<script type="module" src="walkpad.js"></script>
</body></html>
