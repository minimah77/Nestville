function tap(sx,sy){const[ix,iy]=toW(sx,sy);let hit=null;plots.forEach(o=>{const x0=X(o.x,o.y+o.d)-6,x1=X(o.x+o.w,o.y)+6,y0=Yp(o.y,o.z+o.hgt)-6,y1=Yp(o.y+o.d,o.z)+8;if(ix>=x0&&ix<=x1&&iy>=y0&&iy<=y1&&(!hit||o.y+o.d>=hit.y+hit.d))hit=o});if(hit)select(hit,1);else{sel=null;$('#card').style.display='none'}}
/* ---------- ui ---------- */
let tt;function msg(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),6500)}
function select(o,f){sel=o;dirty=1;let h='',p='',b='';
 if(o.k=='house'){h=o.name;p='Resident of Nestville.'}else if(o.k=='open'){h='Open plot';p='Free to claim. Pick a username in My house.';b=`<button class="pb" onclick="openSheet('claim')">Claim a house</button>`}
 else if(o.k=='shop'){const w=S.shops[o.i];h=o.name;p=w?`Owned by ${w.replace(/</g,'')}.`:`For sale: ${fmt(SP)}`;b=w?'':`<button class="pb" onclick="openSheet('shops')">Buy this shop</button>`}
 else if(o.k=='ph'){h=o.name;p=S.ph[o.i]?`Owned by ${S.ph[o.i]}.`:`${fmt(PHP[o.i])} · Not open yet`;b=S.ph[o.i]?'':`<button class="pb" onclick="buyPH(${o.i})">Buy</button>`}
 else{h=o.name;p=o.k=='church'?'The spire is the tallest point in the village.':'It stands on the point and watches the lake.'}
 const c=$('#card');c.innerHTML=`<button class="x" onclick="sel=null;dirty=1;this.parentNode.style.display='none'" aria-label="Close">×</button><h3>${h.replace(/</g,'')}</h3><p>${p}</p>${b}`;c.style.display='block';if(f)flyPlot(o,Math.max(cam.z,1.5))}
function buyPH(i){if(IG_DM)return open(IG_DM,'_blank');msg(`Penthouse ${i+1} is not open yet. When it opens you will buy it through our Instagram DMs.`)}
let tab='claim';
function openSheet(t){tab=t||tab;$('#sheet').classList.add('open');$('#card').style.display='none';pane()}
const closeSheet=()=>$('#sheet').classList.remove('open');
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;pane()});
function pane(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));let h='';
 if(tab=='claim')h=`<h4>Get your house</h4><input id="u" placeholder="@yourusername" autocapitalize="none" autocomplete="off"><button class="pb" onclick="claim()" style="width:100%">Claim my house</button><p class="note">Free. You get a removal code. Keep it: it is the only way to delete your house.</p><input id="ru" placeholder="@username to remove" autocapitalize="none"><input id="rc" placeholder="Removal code"><button class="pb g" onclick="removeH()" style="width:100%">Remove my house</button>`;
 else if(tab=='ph'){h=`<h4>Penthouse hill</h4><p class="note">10 penthouses above the village. They are not open yet. Buying will go through our Instagram DMs.</p>`+PHP.map((p,i)=>`<div class="row"><div>Penthouse ${i+1}<small>${S.ph[i]?`<span class="own">${S.ph[i].replace(/</g,'')}</span>`:fmt(p)}</small></div>${S.ph[i]?'':`<button class="pb" onclick="buyPH(${i})">Buy</button>`}</div>`).join('')}
 else h=`<h4>Village shops</h4><input id="nm" placeholder="Name for your sign (Larry or your username)"><p class="note">Virtual items only, no refunds.</p>`+KINDS.map((k,i)=>`<div class="row"><div>${k}<small>${S.shops[i]?`<span class="own">${S.shops[i].replace(/</g,'')}</span>`:fmt(SP)}</small></div>${S.shops[i]?'':`<button class="pb" onclick="buyShop(${i})">Buy</button>`}</div>`).join('');
 $('#pane').innerHTML=h}
function lists(){$('#stat').textContent=`${S.houses.length} residents`;$('#gfx').textContent=QS[q].n}
function claim(){const u=$('#u').value.trim().replace(/^@/,'').toLowerCase();if(!/^[a-z0-9._]{1,30}$/.test(u))return msg('Use letters, numbers, dots and underscores only.');if(S.houses.some(h=>h.u===u))return msg('That house is already taken.');if(S.houses.length>=hc.length)return msg('The village is full for now.');
 const code=Math.random().toString(36).slice(2,8).toUpperCase();S.houses.push({u,code});save();build();closeSheet();const o=plots.find(p=>p.u===u);if(o)select(o,1);msg(`Welcome @${u}! Your removal code is ${code}. Save it now.`)}
function removeH(){const u=$('#ru').value.trim().replace(/^@/,'').toLowerCase(),c=$('#rc').value.trim().toUpperCase(),i=S.houses.findIndex(h=>h.u===u&&h.code===c);if(i<0)return msg('Username and code do not match.');S.houses.splice(i,1);save();build();sel=null;closeSheet();msg('Your house was removed.')}
function buyShop(i){const n=($('#nm').value||'').trim();if(!n)return msg('Type the name for your sign first.');S.shops[i]=n;save();build();pane();msg(`Reserved for ${n}. In the live version you pay ${fmt(SP)} card to card first.`)}
function find(){const u=$('#q').value.trim().replace(/^@/,'').toLowerCase();if(!u)return;const o=plots.find(p=>p.u===u);if(o){closeSheet();select(o,1)}else{msg(`No house for @${u} yet. Claim it below.`);openSheet('claim');setTimeout(()=>{$('#u').value=u},50)}}
$('#bFind').onclick=find;$('#q').onkeydown=e=>{if(e.key=='Enter')find()};
$('#bMenu').onclick=()=>$('#sheet').classList.contains('open')?closeSheet():openSheet();
const home=()=>flyTo(X(29,20),Yp(20,4)-20,Math.max(minZ(),1.15),1800);
$('#bHome').onclick=()=>{if(tour)setTour(0);closeSheet();home()};
function setTour(v){tour=v;$('#bTour').classList.toggle('on',!!v);tourT=0}
$('#bTour').onclick=()=>{setTour(tour?0:1);if(tour){closeSheet();$('#card').style.display='none';sel=null}};
$('#bGfx').onclick=()=>{q=(q+1)%3;try{localStorage.setItem('nvq',q)}catch(e){}size();build();msg('Graphics: '+QS[q].n)};
let ft=0;
function frame(now){requestAnimationFrame(frame);stepCam(now);if(q==0&&!dirty)return;if(q==1&&now-ft<33&&!dirty)return;ft=now;cx.setTransform(dpr,0,0,dpr,0,0);drawSky(now);drawWorld(now);labels(now);dirty=0}
addEventListener('resize',size);
size();build();pane();
cam={x:760,y:-120,z:minZ()};clamp();requestAnimationFrame(frame);
const U0=new URLSearchParams(location.search).get('u');
setTimeout(()=>{const o=U0&&plots.find(p=>p.u===U0.toLowerCase());o?(select(o,1)):home()},300);
</script></body></html>
